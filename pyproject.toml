[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epl-manager-bounce"
version = "0.3.0"
description = "Matched comparisons of Premier League manager appointments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "polars>=1.30", "plotly>=5.22", "requests>=2.32"]

[project.optional-dependencies]
scraping = ["soccerdata>=1.7", "beautifulsoup4>=4.12", "lxml>=5.2", "pyarrow>=16"]
notebooks = ["jupyter>=1", "ipykernel>=6.29"]
dev = ["pytest>=8"]

[project.scripts]
epl-bounce = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
